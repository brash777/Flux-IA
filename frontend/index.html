<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: la app se dibuja bajo la muesca y la barra
       inferior; los márgenes los ponen los tokens --safe-*. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flux IA</title>
  <meta name="description" content="Tus finanzas personales, con un asistente de IA que responde con tus datos reales.">
  <meta name="theme-color" content="#0A0614">

  <!-- App instalable -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/app-icon-b-tarjetas.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flux IA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preload" href="assets/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/sora-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <!-- GSAP desde cdnjs, con hash de integridad: si el archivo servido no
       es exactamente este, el navegador no lo ejecuta. Si no carga, la app
       funciona igual, sin animaciones. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"
          integrity="sha512-oJ8QbaQThQoJZ7oEv+29jfPM6CcP+zUxh3PKJs1vyOhx0UraUrE7PQgeItu3dOuCJyrzWpoYMsVjkkPEBzbUqw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"
          integrity="sha512-OaIE7ud4P04EhnBuhEcm0wQSceIxbi2pV03oBLS/+F6ampfxsnxcIxOp7H2eF9G7N0kEht0VAzOLG+dTLSo17Q=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Los módulos también se difieren y se ejecutan en orden, después de
       los dos anteriores: GSAP ya está cargado cuando arranca main.js. -->
  <script type="module" src="js/main.js"></script>
</head>
<body class="device-host">
  <div class="device" id="device">
    <div class="outlet" id="outlet"></div>
    <!-- Barra inferior: una sola para toda la app, así no se mueve al
         cambiar de pestaña. La muestra main.js en las pantallas con sesión. -->
    <nav class="nav-bar glass glass--strong" id="nav" aria-label="Secciones" hidden>
      <a class="nav-bar__item" href="#/inicio" data-tab="inicio"><svg class="icon" aria-hidden="true"><use href="assets/icons/ui.svg#i-home"/></svg>Inicio</a>
      <a class="nav-bar__item" href="#/movimientos" data-tab="movimientos"><svg class="icon" aria-hidden="true"><use href="assets/icons/ui.svg#i-swap"/></svg>Movimientos</a>
      <a class="nav-bar__item" href="#/reportes" data-tab="reportes"><svg class="icon" aria-hidden="true"><use href="assets/icons/ui.svg#i-chart"/></svg>Reportes</a>
      <a class="nav-bar__item" href="#/chat" data-tab="chat"><svg class="icon" aria-hidden="true"><use href="assets/icons/ui.svg#i-chat"/></svg>Chat</a>
      <a class="nav-bar__item" href="#/perfil" data-tab="perfil"><svg class="icon" aria-hidden="true"><use href="assets/icons/ui.svg#i-user"/></svg>Perfil</a>
    </nav>
  </div>
  <noscript>
    <p style="padding: 24px; color: #EDE7FB">Flux IA necesita JavaScript para funcionar.</p>
  </noscript>
</body>
</html>
