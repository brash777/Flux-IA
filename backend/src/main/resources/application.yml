# =====================================================================
# Configuracion base de Flux IA.
#
# Regla del proyecto: aqui no hay ni un secreto escrito. Todo valor
# sensible se lee de una variable de entorno (sintaxis ${VAR}). Si la
# variable falta, la aplicacion no arranca, que es lo que queremos:
# es mejor fallar al inicio que correr con una clave por defecto.
# Ver .env.example para la lista completa.
# =====================================================================
spring:
  # Carga el .env del directorio desde el que se arranca (backend/) como si
  # fuera un archivo de propiedades. Es el mecanismo nativo de Spring Boot
  # (spring.config.import, desde la version 2.4): no hace falta ninguna
  # dependencia extra ni ejecutar "source .env" antes de arrancar.
  #
  # "optional:" permite que el archivo no exista. En produccion no hay .env y
  # las variables llegan del entorno del servidor; sin el prefijo, el arranque
  # fallaria alli.
  #
  # Precedencia: una variable de entorno real gana sobre el .env. Asi el
  # servidor de produccion no puede quedar configurado por un archivo olvidado.
  config:
    import: optional:file:./.env[.properties]

  application:
    name: flux-ia-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      # Un computador que se suspende o cambia de red deja conexiones TCP
      # muertas que nadie cierra. Sin límites, el driver espera para siempre
      # una respuesta que no llega, el único hilo que abre conexiones queda
      # bloqueado y toda petición falla hasta reiniciar el servidor. Con
      # estos tiempos, la conexión muerta falla, se descarta y se abre otra.
      connection-timeout: 10000   # ms que una petición espera una conexión
      keepalive-time: 60000       # ms entre comprobaciones de las inactivas
      data-source-properties:
        loginTimeout: 10          # s para abrir una conexión
        socketTimeout: 30         # s sin respuesta; ninguna consulta tarda tanto
        tcpKeepAlive: true

  jpa:
    # El esquema lo manda Flyway. Hibernate solo verifica que las
    # entidades coincidan con las tablas y aborta si no.
    hibernate:
      ddl-auto: validate
    # Evita que las consultas perezosas se resuelvan dentro del
    # controlador; obliga a cargar los datos en la capa de servicio.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    resources:
      # El servidor tambien entrega la app web (frontend/). Asi la app y la
      # API comparten origen: un celular o la app de Expo necesitan una
      # sola direccion, sin CORS ni IPs escritas en el frontend. La ruta es
      # relativa a backend/, desde donde se arranca (igual que el .env).
      static-locations: ${FRONTEND_DIR:file:../frontend/}

  jackson:
    # Los nulos SI se serializan. En esta API un null es informacion:
    # savingsRate null significa "no hubo ingresos, no se puede calcular",
    # que no es lo mismo que 0 %. Omitir la clave obligaria al cliente a
    # distinguir entre ausente y nulo, y haria el contrato ambiguo.
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  # Detras de un tunel o de un proxy con HTTPS (cloudflared, Render), la
  # peticion llega en http. Con esto se respeta X-Forwarded-Proto y el
  # servidor sabe que el origen real es https; si no, tomaria las
  # peticiones de su propia app por peticiones de otro origen.
  forward-headers-strategy: native
  error:
    # Nunca devolver trazas internas al cliente.
    include-message: never
    include-stacktrace: never

# --- Ajustes propios de la aplicacion -------------------------------
flux:
  # Zona con la que se delimitan los periodos de los reportes. Las
  # fechas se guardan en UTC; esta zona define donde empieza un mes.
  timezone: ${APP_TIMEZONE:America/Bogota}

  jwt:
    secret: ${JWT_SECRET}
    issuer: flux-ia
    # Token de acceso corto: si se filtra, sirve poco tiempo.
    access-token-ttl: PT15M
    # Token de refresco largo, revocable desde la base de datos.
    refresh-token-ttl: P30D

  cors:
    # Origenes del frontend. En produccion se pasa la URL real.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    enabled: ${AI_ENABLED:true}
    # groq (gratis, por omision), gemini (gratis), anthropic (de pago) u
    # openai (cualquier API compatible: exige AI_BASE_URL y AI_MODEL).
    provider: ${AI_PROVIDER:groq}
    # La clave de IA vive SOLO aqui, en el servidor. El frontend nunca
    # la ve: le pega a POST /api/v1/ai/chat y el backend llama al modelo.
    # ANTHROPIC_API_KEY se sigue leyendo para no romper un .env anterior.
    api-key: ${AI_API_KEY:${ANTHROPIC_API_KEY:}}
    base-url: ${AI_BASE_URL:}
    # Vacios, se usan el modelo y los de respaldo del proveedor
    # (AiProvider). Los de respaldo van separados por coma.
    model: ${AI_MODEL:}
    fallback-models: ${AI_FALLBACK_MODELS:}
    # Tope de tokens de la respuesta. En los modelos con razonamiento,
    # el razonamiento tambien consume de este tope, asi que un valor muy
    # bajo podria cortar la respuesta a medias.
    max-tokens: 4096
    # Nivel de esfuerzo: LOW alcanza para respuestas de chat, es el mas
    # rapido y el que menos cuota gasta.
    effort: LOW
    # Turnos previos que se mandan al modelo: los del plan gratuito se
    # miden en tokens por minuto, y una charla larga los agotaria.
    max-history-turns: 8
    timeout: PT60S

  password-reset:
    token-ttl: PT30M

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

logging:
  level:
    com.fluxia.backend: INFO
